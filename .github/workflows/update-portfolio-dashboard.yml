name: Update portfolio dashboard

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"
      timezone: "Europe/Vienna"
  push:
    paths:
      - ".github/workflows/update-portfolio-dashboard.yml"
      - "scripts/ensure_manual_update_link.py"
      - "scripts/update_dashboard_data.py"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: production-portfolio-update
  cancel-in-progress: false

jobs:
  update-portfolio:
    name: Validate, update and publish portfolio data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run regression tests
        run: pytest -q

      - name: Verify immutable legacy history before update
        run: python scripts/verify_immutable_history.py

      - name: Load current free market prices
        run: |
          python scripts/update_yahoo_prices.py \
            --output data/prices/latest.json \
            --coverage-output /tmp/coverage.json \
            --discovery-output /tmp/discovery-results.json

      - name: Require complete positive price set
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path("data/prices/latest.json").read_text())
          prices = doc["prices"]
          assert len(prices) == 23, f"Expected 23 prices, got {len(prices)}"
          assert all(float(item["price"]) > 0 for item in prices), "Non-positive price found"
          assert all(item["status"] in {"fresh", "stale", "fallback"} for item in prices)
          print(f"Validated {len(prices)} positive prices.")
          PY

      - name: Calculate current portfolio
        run: |
          python scripts/calculate_dry_run.py \
            --prices data/prices/latest.json \
            --output data/generated/dry-run-portfolio.json

      - name: Require all portfolio invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/generated/dry-run-portfolio.json").read_text())
          failed = [name for name, passed in report["validations"].items() if not passed]
          if failed:
              raise SystemExit(f"Failed invariants: {', '.join(failed)}")
          print("All portfolio invariants passed.")
          PY

      - name: Refresh visible dashboard data and daily history
        run: python scripts/update_dashboard_data.py

      - name: Ensure dashboard shell is current
        run: python scripts/ensure_manual_update_link.py

      - name: Verify dashboard and persisted history
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          html = Path("index.html").read_text()
          portfolio = json.loads(Path("data/generated/dry-run-portfolio.json").read_text())
          match = re.search(r'const DATA=(\{.*?\});\n', html, flags=re.S)
          assert match, "Dashboard DATA object missing"
          dashboard = json.loads(match.group(1))
          history_doc = json.loads(Path("data/history/portfolio-history.json").read_text())
          history = history_doc["history"]
          assert abs(float(dashboard["meta"]["total"]) - float(portfolio["total"])) < 0.000001
          assert len(dashboard["companies"]) == len(portfolio["companies"])
          assert dashboard["history"] == history, "Inline and persisted history differ"
          assert history[-1]["date"] == dashboard["meta"]["asof"], "Latest history date is not current as-of date"
          assert abs(float(history[-1]["value"]) - float(portfolio["total"])) < 0.000001
          assert 'id="manualUpdateLink"' in html, "Manual update link missing"
          assert 'id="historyPeriodBadge"' in html, "Dynamic history badge missing"
          print(f"Dashboard matches portfolio output with {len(history)} persisted history points.")
          PY

      - name: Upload private dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dashboard-${{ github.run_number }}
          path: index.html
          if-no-files-found: error
          retention-days: 14

      - name: Verify immutable legacy history after update
        run: python scripts/verify_immutable_history.py

      - name: Show intended production changes
        run: git diff -- data/prices/latest.json data/generated/dry-run-portfolio.json data/history/portfolio-history.json index.html

      - name: Commit validated production data, history and dashboard
        run: |
          if git diff --quiet -- data/prices/latest.json data/generated/dry-run-portfolio.json data/history/portfolio-history.json index.html; then
            echo "No production data changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/prices/latest.json data/generated/dry-run-portfolio.json data/history/portfolio-history.json index.html
            git commit -m "Update validated portfolio dashboard"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare published site
        run: |
          rm -rf _site
          mkdir _site
          cp index.html _site/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
