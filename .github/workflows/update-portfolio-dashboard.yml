name: Update portfolio dashboard

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"
      timezone: "Europe/Vienna"
  push:
    paths:
      - ".github/workflows/update-portfolio-dashboard.yml"
      - "scripts/sync_dashboard_header.py"
      - "scripts/update_dashboard_data.py"
      - "scripts/update_movers_data.py"
      - "scripts/update_transactions_data.py"
      - "scripts/reconstruct_portfolio_history.py"
      - "scripts/update_history_ui.py"
      - "data/transactions.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: production-portfolio-update
  cancel-in-progress: false

jobs:
  update-portfolio:
    name: Validate, update and publish portfolio data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run regression tests
        run: pytest -q

      - name: Verify immutable legacy history before update
        run: python scripts/verify_immutable_history.py

      - name: Load current free market prices
        run: |
          python scripts/update_yahoo_prices.py \
            --output data/prices/latest.json \
            --coverage-output /tmp/coverage.json \
            --discovery-output /tmp/discovery-results.json

      - name: Require complete positive price set
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path("data/prices/latest.json").read_text())
          prices = doc["prices"]
          assert len(prices) == 23, f"Expected 23 prices, got {len(prices)}"
          assert all(float(item["price"]) > 0 for item in prices), "Non-positive price found"
          assert all(item["status"] in {"fresh", "stale", "fallback"} for item in prices)
          print(f"Validated {len(prices)} positive prices.")
          PY

      - name: Calculate current portfolio
        run: |
          python scripts/calculate_dry_run.py \
            --prices data/prices/latest.json \
            --output data/generated/dry-run-portfolio.json

      - name: Require all portfolio invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/generated/dry-run-portfolio.json").read_text())
          failed = [name for name, passed in report["validations"].items() if not passed]
          if failed:
              raise SystemExit(f"Failed invariants: {', '.join(failed)}")
          print("All portfolio invariants passed.")
          PY

      - name: Reconstruct portfolio history from depot beginning
        run: python scripts/reconstruct_portfolio_history.py

      - name: Refresh visible dashboard data and daily history
        run: python scripts/update_dashboard_data.py

      - name: Refresh security movers history and rankings
        run: python scripts/update_movers_data.py

      - name: Synchronize dashboard shell
        run: python scripts/sync_dashboard_header.py

      - name: Render transaction history
        run: python scripts/update_transactions_data.py

      - name: Render long-term history UI
        run: python scripts/update_history_ui.py

      - name: Verify dashboard and persisted history
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          html = Path("index.html").read_text()
          portfolio = json.loads(Path("data/generated/dry-run-portfolio.json").read_text())
          match = re.search(r'const DATA=(\{.*?\});\n', html, flags=re.S)
          assert match, "Dashboard DATA object missing"
          dashboard = json.loads(match.group(1))
          history_doc = json.loads(Path("data/history/portfolio-history.json").read_text())
          history = history_doc["history"]
          reconstructed = json.loads(Path("data/history/reconstructed-history.json").read_text())
          security_history = json.loads(Path("data/history/security-history.json").read_text())["snapshots"]
          transactions = json.loads(Path("data/transactions.json").read_text()).get("transactions", [])
          assert abs(float(dashboard["meta"]["total"]) - float(portfolio["total"])) < 0.000001
          assert len(dashboard["companies"]) == len(portfolio["companies"])
          assert dashboard["history"] == history, "Inline and persisted history differ"
          assert history[0]["date"] == "16.08.2022", "History does not begin at documented depot start"
          assert len(history) > 150, f"Expected long-term history, got only {len(history)} points"
          assert reconstructed["meta"]["transactions"] == 240, "Reconstruction does not use all imported transactions"
          assert all("net_contributions" in row and "gain" in row for row in history), "Cashflow-aware fields missing from history"
          assert float(history[-1]["net_contributions"]) > 10000, "Net contributions unexpectedly zero or too small"
          assert history[-1]["date"] == dashboard["meta"]["asof"], "Latest history date is not current as-of date"
          assert abs(float(history[-1]["value"]) - float(portfolio["total"])) < 0.000001
          assert dashboard.get("movers", {}).get("periods"), "Movers data missing"
          assert security_history, "Security history missing"
          assert len(transactions) == 240, f"Expected 240 transactions, got {len(transactions)}"
          assert 'id="manualUpdateLink"' in html, "Manual update link missing"
          assert 'id="historyPeriodBadge"' in html, "Dynamic history badge missing"
          assert 'Gesamtdepotentwicklung seit Depotbeginn' in html, "Long-term history chart missing"
          assert 'data-page="transactions"' in html, "Transactions navigation missing"
          assert 'id="transactions"' in html, "Transactions page missing"
          assert '240 Vorgänge' in html, "Rendered transaction count missing"
          assert 'Siemens Energy' in html and 'LVMH' in html, "Transaction content missing"
          assert "Look-through Dashboard" not in re.search(r'<div class="sub">.*?</div>', html, flags=re.S).group(0), "Old sidebar label still present"
          print(f"Dashboard matches portfolio output with {len(history)} total history points, {len(reconstructed['history'])} reconstructed points, {len(security_history)} security history points and {len(transactions)} transactions.")
          PY

      - name: Upload private dashboard artifact
        uses: actions/upload-artifact@v5
        with:
          name: portfolio-dashboard-${{ github.run_number }}
          path: index.html
          if-no-files-found: error
          retention-days: 14

      - name: Verify immutable legacy history after update
        run: python scripts/verify_immutable_history.py

      - name: Show intended production changes
        run: git diff -- data/prices/latest.json data/generated/dry-run-portfolio.json data/history/portfolio-history.json data/history/reconstructed-history.json data/history/security-history.json data/transactions.json index.html

      - name: Commit validated production data, history and dashboard
        run: |
          if git diff --quiet -- data/prices/latest.json data/generated/dry-run-portfolio.json data/history/portfolio-history.json data/history/reconstructed-history.json data/history/security-history.json data/transactions.json index.html; then
            echo "No production data changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/prices/latest.json data/generated/dry-run-portfolio.json data/history/portfolio-history.json data/history/reconstructed-history.json data/history/security-history.json data/transactions.json index.html
            git commit -m "Update validated portfolio dashboard"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare published site
        run: |
          rm -rf _site
          mkdir _site
          cp index.html _site/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
