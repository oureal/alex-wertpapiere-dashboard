name: Private market-data test

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-data-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-market-data:
    name: Test free market-data pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_OUTPUT: .artifacts/market-data-test

    steps:
      - name: Check out private repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Verify immutable legacy history
        run: python scripts/verify_immutable_history.py

      - name: Validate committed data and report
        run: python scripts/validate_data.py --check-report > validation-check.log

      - name: Prepare private run output
        run: |
          mkdir -p "$RUN_OUTPUT"
          cp data/legacy/validation-report.json "$RUN_OUTPUT/validation-report.json"

      - name: Diagnose free-source network reachability
        continue-on-error: true
        run: python scripts/network_diagnostics.py --output "$RUN_OUTPUT/research-report.json"

      - name: Load and runtime-validate Yahoo Finance prices
        run: |
          python scripts/update_yahoo_prices.py \
            --output "$RUN_OUTPUT/latest.json" \
            --coverage-output "$RUN_OUTPUT/coverage.json" \
            --discovery-output "$RUN_OUTPUT/discovery-results.json"

      - name: Exercise provider-neutral price supply in dry-run mode
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          prices = json.loads((Path(os.environ["RUN_OUTPUT"]) / "latest.json").read_text())["prices"]
          assert len(prices) == 23
          assert all(float(item["price"]) > 0 for item in prices)
          assert all(item["status"] in {"fresh", "stale", "fallback"} for item in prices)
          print(f"Validated {len(prices)} positive cached/fallback prices.")
          PY

      - name: Calculate portfolio dry run
        run: |
          python scripts/calculate_dry_run.py \
            --prices "$RUN_OUTPUT/latest.json" \
            --output "$RUN_OUTPUT/dry-run-portfolio.json" \
            > dry-run.log

      - name: Verify all dry-run sum invariants
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUN_OUTPUT"]) / "dry-run-portfolio.json").read_text())
          failed = [name for name, passed in report["validations"].items() if not passed]
          if failed:
              raise SystemExit(f"Failed invariants: {', '.join(failed)}")
          print("All dry-run sum invariants passed:", ", ".join(report["validations"]))
          PY

      - name: Prove tracked files were not modified
        run: git diff --exit-code

      - name: Upload private market-data test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-test-${{ github.run_id }}
          path: |
            .artifacts/market-data-test/coverage.json
            .artifacts/market-data-test/discovery-results.json
            .artifacts/market-data-test/research-report.json
            .artifacts/market-data-test/latest.json
            .artifacts/market-data-test/dry-run-portfolio.json
            .artifacts/market-data-test/validation-report.json
          if-no-files-found: warn
          retention-days: 7
